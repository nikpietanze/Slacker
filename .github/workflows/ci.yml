name: CI

# Companion unit tests on every OS, plus the addon's Lua run against a mocked
# client (companion/internal/addontest).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - name: Vet
        working-directory: companion
        run: go vet -unsafeptr=false ./...
      - name: Test
        working-directory: companion
        run: go test ./...
