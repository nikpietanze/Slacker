name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Builds Slacker-<tag>.zip and attaches it to a GitHub release.
      # Add a CF_API_KEY secret and an X-Curse-Project-ID line in the TOC to
      # also upload to CurseForge.
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

  companion:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum

      - name: Test
        run: make test

      # Adds the companion binaries to the release the packager just made.
      - name: Build and attach companion binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make build VERSION=${{ github.ref_name }}
          gh release upload "${{ github.ref_name }}" dist/* --clobber
