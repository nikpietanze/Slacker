name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Slacker aims to stay tiny. Check "Non-goals" in docs/HANDOFF.md before suggesting a big addition. Message previews, senders, channel names and anything that connects to Slack directly are out of scope on purpose.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve during play?
